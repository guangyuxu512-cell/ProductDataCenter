# Optional read-only category lookup through an authorized Worker.
# Use with the existing central connection and Worker precheck overlays.
services:
  product-api:
    environment:
      BACKEND_DOUYIN_CATEGORY_LOOKUP_ENABLED: 'true'
      BACKEND_WORKER_PRECHECK_ENABLED: 'true'
      BACKEND_CATEGORY_CACHE_FILE: /var/lib/product-category-cache/categories.sqlite3
    volumes:
      - product-category-cache:/var/lib/product-category-cache

volumes:
  product-category-cache:
