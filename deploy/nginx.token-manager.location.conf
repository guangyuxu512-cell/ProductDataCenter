# Include inside the existing HTTPS server block. This is a standalone static
# app; all Token operations still require their own Bearer authorization.
location = /token-manager { return 308 /token-manager/; }
location ^~ /token-manager/ {
    auth_basic off;
    alias /var/lib/product-data-center/token-manager/current/;
    index index.html;
    types { text/html html; text/css css; application/javascript js; }
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
