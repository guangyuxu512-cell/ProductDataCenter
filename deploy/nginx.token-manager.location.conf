# The former product-only manager now opens the shared management page.
# Product API authorization and existing credentials remain unchanged.
location = /token-manager {
    auth_basic off;
    return 302 "https://center.mysiyuai.top/token-admin/#product";
}
location ^~ /token-manager/ {
    auth_basic off;
    return 302 "https://center.mysiyuai.top/token-admin/#product";
}
