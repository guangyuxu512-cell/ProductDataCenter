name: Product workbench CI
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdc_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: product_workbench_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pdc_test -d product_workbench_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: python scripts/verify-source-baseline.py
      - run: python -m pytest
        working-directory: backend
      - run: python -m pytest -m integration
        working-directory: backend
        env:
          BACKEND_DATABASE_URL: postgresql+psycopg://pdc_test:isolated-test-only@127.0.0.1:5432/product_workbench_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: python scripts/test_web_configuration.py
      - run: docker build -f deploy/api.Dockerfile -t product-api:test .
      - run: docker build -f deploy/web.Dockerfile -t product-web:test .
      - run: python scripts/container-smoke.py
      - name: Package verified images for NAS rehearsal
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-images
          docker tag product-api:test product-data-center-api:${{ github.sha }}
          docker tag product-web:test product-data-center-web:${{ github.sha }}
          docker save product-data-center-api:${{ github.sha }} product-data-center-web:${{ github.sha }} | gzip > release-images/product-workbench-images.tar.gz
          cd release-images
          sha256sum product-workbench-images.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: product-workbench-images-${{ github.sha }}
          path: release-images/
          compression-level: 0
          retention-days: 3
