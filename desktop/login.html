<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>商品云库登录</title>
  <style>
    body{font:14px "Microsoft YaHei",sans-serif;margin:22px;color:#202b3a;background:#fff} label{display:block;margin:10px 0 4px}
    input{box-sizing:border-box;width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 9px}
    .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px} button{border:1px solid #cbd5e1;border-radius:5px;background:white;padding:7px 18px;cursor:pointer}
    button[type=submit]{background:#2563eb;color:white;border-color:#2563eb} button:disabled{opacity:.6;cursor:default} #error{color:#b42318;min-height:18px;margin-top:8px}
  </style>
</head>
<body>
  <form id="login-form">
    <label for="username">用户名</label><input id="username" autocomplete="username" required autofocus>
    <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
    <div id="error" role="alert"></div>
    <div class="actions"><button type="button" id="cancel">取消</button><button type="submit" id="submit">登录</button></div>
  </form>
  <script src="./login-renderer.js"></script>
</body>
</html>
